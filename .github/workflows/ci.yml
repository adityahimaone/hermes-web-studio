name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: go test ./...
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: sh scripts/check-performance-budget.sh frontend/dist
      - run: GOCACHE=/tmp/hermes-webui-go-cache go test ./... && GOCACHE=/tmp/hermes-webui-go-cache go build -trimpath -o hermes-web-studio ./cmd/hermes-web-studio
        working-directory: backend

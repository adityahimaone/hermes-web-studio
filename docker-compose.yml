services:
  hermes-web-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-web-studio:local
    ports:
      - "8080:8080"
    environment:
      HERMES_WEBUI_GATEWAY_BASE_URL: ${HERMES_WEBUI_GATEWAY_BASE_URL:-http://host.docker.internal:8642}
      HERMES_WEBUI_GATEWAY_API_KEY: ${HERMES_WEBUI_GATEWAY_API_KEY:?HERMES_WEBUI_GATEWAY_API_KEY is required}
      HERMES_WEBUI_DEFAULT_MODEL: ${HERMES_WEBUI_DEFAULT_MODEL:-default}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
